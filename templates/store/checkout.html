<div class="page-header">
  <div class="page-header-inner">
    <h1>Check<span style="color: var(--accent);">out</span></h1>
  </div>
</div>

<div class="section">
  <div style="max-width: 600px; margin: 0 auto;">
    <form method="post">
      /* csrf_token */
      <div class="form-card">
        <h2 class="form-title" style="margin-bottom: 1.5rem;">Shipping Details</h2>

        <div class="form-grid">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="full_name" required
              value="{% if user.is_authenticated %}{{ user.get_full_name }}{% endif %}">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required value="{% if user.is_authenticated %}{{ user.email }}{% endif %}">
          </div>
          <div class="form-group full">
            <label>Address</label>
            <input type="text" name="address" required placeholder="123 Main St">
          </div>
          <div class="form-group">
            <label>City</label>
            <input type="text" name="city" required>
          </div>
          <div class="form-group">
            <label>Postal Code</label>
            <input type="text" name="postal_code" required>
          </div>
          <div class="form-group full">
            <label>Country</label>
            <input type="text" name="country" required value="Ireland">
          </div>
        </div>

        <div
          style="border-top: 1px solid var(--border); padding-top: 1.5rem; margin-top: 1rem; display: flex; justify-content: space-between; align-items: center;">
          <span
            style="font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; color: var(--text-muted);">Order
            Total</span>
          <span style="font-family: var(--font-display); font-size: 1.8rem; font-weight: 900; color: var(--accent);">€{{
            total }}</span>
        </div>

        <button type="submit" class="btn btn-primary btn-full"
          style="margin-top: 1.5rem; font-size: 1.05rem; padding: 1rem;">
          Continue to Payment →
        </button>
      </div>
    </form>
  </div>
</div>
