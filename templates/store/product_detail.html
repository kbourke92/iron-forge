<div class="section">
  <div style="margin-bottom: 2rem;">
    <a href="store:product_list" style="color: var(--text-muted); font-size: 0.9rem;">← Back to Shop</a>
  </div>

  <div class="product-detail-grid">
    <div class="product-detail-img">
      /* if product.image */
      <img src="product.image.url" alt="product description" style="width: 100%; height: 100%; object-fit: cover;">
      /* else */
      <div style="font-size: 8rem; color: var(--border);">⚡</div>
    </div>

    <div class="product-detail-info">
      /* if product.category */
      <p class="product-category"
        style="font-size: 0.8rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 0.75rem;">
      </p>

      <h1 class="product-detail-name">{{ product.name }}</h1>
      <p class="product-detail-price">€{{ product.price }}</p>

      /* if product.stock > 0 */
      <div class="stock-indicator">
        <span class="stock-dot"></span>
        In Stock (available)
      </div>
      <div class="stock-indicator" style="color: #e84343;">
        <span class="stock-dot" style="background: #e84343;"></span>
        Out of Stock
      </div>


      <p class="product-detail-desc">{{ product.description }}</p>

      /* if product.stock > 0 */
      <a href="{% url 'store:add_to_cart' product.id %}" class="btn btn-primary"
        style="width: 100%; justify-content: center; font-size: 1.1rem; padding: 1rem 2rem;">
        Add to Cart
      </a>
      <button class="btn btn-outline" disabled
        style="width: 100%; justify-content: center; opacity: 0.5; cursor: not-allowed;">
        Out of Stock
      </button>

    </div>
  </div>
</div>
