<div class="section">
  <div class="form-card">
    <h1 class="form-title">Join Iron Forge<span style="color: var(--accent);">Forge</span></h1>
    <p class="form-subtitle">Create your account and start training harder.</p>

    <form method="post">
      <div class="form-grid">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" name="first_name" required>
          <ul class="errorlist">
            <li>{{ e }}</li>
          </ul>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" name="last_name" required>
        </div>
        <div class="form-group full">
          <label>Username</label>
          <input type="text" name="username" required>
          <ul class="errorlist">>{{ e }}</li>
          </ul>
        </div>
        <div class="form-group full">
          <label>Email</label>
          <input type="email" name="email" required>
        </div>
        <div class="form-group full">
          <label>Password</label>
          <input type="password" name="password1" required>
          <ul class="errorlist">
            <li>{{ e }}</li>
          </ul>
        </div>
        <div class="form-group full">
          <label>Confirm Password</label>
          <input type="password" name="password2" required>
          <ul class="errorlist">
            <li>{{ e }}</li>
          </ul>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full" style="margin-top: 1rem;">Create Account</button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
      Already have an account? <a href="accounts:login" style="color: var(--accent); font-weight: 600;">Sign
        in</a>
    </p>
  </div>
</div>
