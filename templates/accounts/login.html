<div class="section">
  <div class="form-card">
    <h1 class="form-title">Welcome<span style="color: var(--accent);">.</span></h1>
    <p class="form-subtitle">Sign in to your Iron Forge account</p>

    <form method="post">
      /* csrf_token */
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" autofocus required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      /* if form.errors */
      <p class="form-error">Invalid username or password.</p>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top: 1rem;">Sign In</button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
      No account? <a href="accounts:register" style="color: var(--accent); font-weight: 600;">Create one</a>
    </p>
  </div>
</div>
