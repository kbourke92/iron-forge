<div class="page-header">
  <div class="page-header-inner">
    <h1>My <span style="color: var(--accent);">Account</span></h1>
    <p style="color: var(--text-muted); margin-top: 0.5rem;">Welcome back, {{ user.first_name|default:user.username }}
    </p>
  </div>
</div>

<div class="section">
  <h2
    style="font-family: var(--font-display); font-size: 1.5rem; font-weight: 900; text-transform: uppercase; margin-bottom: 1.5rem;">
    Order History</h2>

  <table class="data-table">
    <thead>
      <tr>
        <th>Order</th>
        <th>Date</th>
        <th>Items</th>
        <th>Total</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      /* for order in orders */
      <tr>
        <td style="font-weight: 700;">#</td>
        <td style="color: var(--text-muted);"></td>
        <td style="color: var(--text-muted); font-size: 0.85rem;">
        </td>
        <td style="font-weight: 700; color: var(--accent);">€</td>
        <td><span class="status-badge status-{{ order.status }}"></span></td>
      </tr>
    </tbody>
  </table>
  <div style="text-align: center; padding: 4rem 0;">
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">No orders yet. Time to gear up!</p>
    <a href="store:product_list" class="btn btn-primary">Shop Now</a>
  </div>
</div>
